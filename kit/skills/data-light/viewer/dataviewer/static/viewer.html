<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERD 보기</title>
<style nonce="__NONCE__">
:root{
  --font:"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","D2Coding","Consolas",monospace;
}
/* 다섯 가지 테마 -- 화면 틀(--ui-*)과 그림(--*) 을 함께 바꾼다 */
.t-paper{--bg:#E8ECF0;--dot:#C9D1D9;--ui:#F7F9FA;--ui-line:#D3DAE1;--ink:#1C2632;--mute:#627285;--plate:#FFFFFF;--plate-line:#B9C3CD;--head:#F2F5F7;
  --rel:#6F7F90;--hl:#0B7A75;--sel:#0B7A75;--frame:#FFFFFF66;--frame-line:#AEB8C2;--k-code:#9A7B2F;--k-base:#3B6A99;--k-tx:#2D7D52;--k-hist:#76589A;--k-pi:#B3383B;--bad:#B3383B}
.t-night{--bg:#1F2835;--dot:#2E3A4A;--ui:#252F3D;--ui-line:#36445A;--ink:#E2E8F0;--mute:#93A3B8;--plate:#2B3646;--plate-line:#43536A;--head:#323F51;
  --rel:#8798AD;--hl:#F0B84A;--sel:#F0B84A;--frame:#ffffff08;--frame-line:#3E4C61;--k-code:#D6B25E;--k-base:#6FA3D8;--k-tx:#62C08B;--k-hist:#B597DB;--k-pi:#F07A7D;--bad:#F07A7D}
.t-blue{--bg:#1A4C84;--dot:#2B629E;--ui:#173F6C;--ui-line:#2F619A;--ink:#EEF5FF;--mute:#A9C4E4;--plate:#1D5592;--plate-line:#CFE0F5;--head:#22609F;
  --rel:#CFE0F5;--hl:#FFD45C;--sel:#FFD45C;--frame:#ffffff0a;--frame-line:#8FB3DC;--k-code:#FFE08A;--k-base:#BFE0FF;--k-tx:#A8F0C6;--k-hist:#E2C8FF;--k-pi:#FFB0A8;--bad:#FFB0A8}
.t-pastel{--bg:#F3F0F8;--dot:#E0D9EC;--ui:#FBFAFD;--ui-line:#E2DCEC;--ink:#2E2840;--mute:#7A7190;--plate:#FFFFFF;--plate-line:#D6CDE6;--head:#F7F4FB;
  --rel:#9A8FB3;--hl:#7C4DDB;--sel:#7C4DDB;--frame:#ffffff80;--frame-line:#D3C9E5;--k-code:#E0B354;--k-base:#7FA9E0;--k-tx:#6CC49A;--k-hist:#B892E6;--k-pi:#EE8A97;--bad:#C2414F}
.t-contrast{--bg:#FFFFFF;--dot:#FFFFFF;--ui:#FFFFFF;--ui-line:#000000;--ink:#000000;--mute:#2B2B2B;--plate:#FFFFFF;--plate-line:#000000;--head:#FFFFFF;
  --rel:#000000;--hl:#0040E0;--sel:#0040E0;--frame:#ffffff00;--frame-line:#000000;--k-code:#7A5A00;--k-base:#003C8F;--k-tx:#005C2E;--k-hist:#56208F;--k-pi:#B00000;--bad:#B00000}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 var(--font);color:var(--ink);background:var(--bg);display:grid;grid-template-rows:auto 1fr;grid-template-columns:270px 1fr;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hl);outline-offset:1px}
header{grid-column:1/3;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:8px 14px;background:var(--ui);border-bottom:1px solid var(--ui-line)}
header h1{font-size:15px;font-weight:700;margin:0 6px 0 0;letter-spacing:-.01em;white-space:nowrap}
header h1 small{font-weight:400;color:var(--mute);margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--ui-line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer;border-right:1px solid var(--ui-line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--ui)}
.seg button:disabled{opacity:.4;cursor:default}
.grp{display:inline-flex;align-items:center;gap:6px}
.grp>span{color:var(--mute);font-size:12px}
.btn{border:1px solid var(--ui-line);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.due{background:var(--hl);border-color:var(--hl);color:var(--ui)}
select{border:1px solid var(--ui-line);background:var(--ui);border-radius:6px;padding:3px 6px}
.spacer{flex:1}
aside{background:var(--ui);border-right:1px solid var(--ui-line);display:flex;flex-direction:column;min-height:0}
aside .find{padding:10px 12px;border-bottom:1px solid var(--ui-line)}
aside input[type=search]{width:100%;border:1px solid var(--ui-line);border-radius:6px;padding:5px 8px;background:var(--plate)}
aside .pick{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:12px;color:var(--mute)}
aside .pick .seg button{padding:2px 8px;font-size:12px}
#list{overflow:auto;flex:1;padding:4px 0 16px}
.src{padding:10px 12px 2px;font-weight:700;font-size:12px;display:flex;justify-content:space-between;gap:6px}
.src span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.src em{font-style:normal;font-weight:400;color:var(--mute);flex:none}
.src .err{color:var(--bad);font-weight:400}
.msg{margin:2px 12px 6px;padding:6px 8px;border-left:3px solid var(--bad);font-size:12px;color:var(--ink);background:var(--plate)}
.msg.warn{border-left-color:var(--k-code)}
.sch{padding:6px 12px 2px 18px;color:var(--mute);font-size:12px}
.item{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border:0;background:transparent;padding:3px 12px 3px 18px;cursor:pointer}
.item:hover{background:var(--head)}
.item i{width:4px;height:14px;border-radius:1px;flex:none}
.item b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--mute);margin-left:auto;font-size:11px;white-space:nowrap}
.item[aria-pressed=true]{background:var(--head);box-shadow:inset 3px 0 0 var(--sel)}
.item[aria-pressed=true] b{font-weight:700}
.item.hide{display:none}
main{position:relative;min-width:0;min-height:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px}
svg#c{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
svg#c.panning{cursor:grabbing}
#status{position:absolute;left:12px;bottom:10px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);background:var(--ui);border:1px solid var(--ui-line);border-radius:6px;padding:3px 9px;max-width:calc(100% - 24px)}
#status .dot{width:7px;height:7px;border-radius:50%;background:var(--k-tx);flex:none}
#status.off .dot{background:var(--mute)}
#status.bad .dot{background:var(--bad)}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ui);padding:5px 8px;border-radius:5px;font-size:12px;display:none;max-width:340px;z-index:3}
#empty{position:absolute;inset:0;display:none;place-content:center;text-align:center;color:var(--mute);padding:20px}
#empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
/* 그림 */
.frame rect{fill:var(--frame);stroke:var(--frame-line);stroke-dasharray:6 4}
.frame text{fill:var(--mute);font:600 12px var(--font)}
.frame text tspan.s{font-weight:400}
.ent{cursor:pointer}
.ent .plate{fill:var(--plate);stroke:var(--plate-line);stroke-width:1}
.ent .head{fill:var(--head)}
.ent .tab{fill:var(--kc)}
.ent .sep{stroke:var(--plate-line)}
.ent .nm{fill:var(--ink);font:700 13px var(--font)}
.ent .ph{fill:var(--mute);font:400 11px var(--font)}
.ent .cn{fill:var(--ink);font:400 12px var(--font)}
.ent .cn.nn{font-weight:600}
.ent .ct{fill:var(--mute);font:400 11px var(--mono)}
.ent .ck{fill:var(--kc);font:700 9.5px var(--font);letter-spacing:.02em}
.ent .cpi{fill:var(--k-pi);font:700 9.5px var(--font)}
.ent .more{fill:var(--mute);font:italic 11px var(--font)}
.ent.sel .plate{stroke:var(--sel);stroke-width:2.2}
.ent.match .plate{stroke:var(--hl);stroke-dasharray:3 2}
.k-코드{--kc:var(--k-code)}.k-기준{--kc:var(--k-base)}.k-거래{--kc:var(--k-tx)}.k-이력{--kc:var(--k-hist)}.k-PI{--kc:var(--k-pi)}
.rel path{fill:none;stroke:var(--rel);stroke-width:1.3}
.rel .hit{stroke:transparent;stroke-width:12;cursor:help}
.rel circle{fill:var(--plate);stroke:var(--rel);stroke-width:1.3}
.rel.opt .line{stroke-dasharray:5 3}
.focus .ent{opacity:.28}.focus .rel{opacity:.12}
.focus .ent.on,.focus .rel.on{opacity:1}
.rel.on path:not(.hit),.rel.on circle{stroke:var(--hl);stroke-width:2}
.rel.flow .line{stroke:var(--sel);stroke-width:2;stroke-dasharray:7 5;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.t-contrast .rel path{stroke-width:1.6}.t-contrast .ent .plate{stroke-width:1.4}
@media (prefers-reduced-motion:reduce){.rel.flow .line{animation:none}}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}aside{max-height:32vh;border-right:0;border-bottom:1px solid var(--ui-line)}header{grid-column:1}}
</style>
</head>
<body class="t-paper">
<header>
  <h1 id="title">ERD 보기<small id="sub"></small></h1>
  <div class="grp"><span id="lvl-l">보기</span><div class="seg" id="level" role="group" aria-labelledby="lvl-l">
    <button data-v="1" title="엔터티 이름만 (1)">엔터티</button><button data-v="2" title="키 컬럼 (2)">키</button><button data-v="3" title="모든 컬럼 (3)">컬럼</button><button data-v="4" title="컬럼과 자료형 (4)">타입</button></div></div>
  <div class="grp"><span id="nm-l">이름</span><div class="seg" id="names" role="group" aria-labelledby="nm-l">
    <button data-v="kor">논리</button><button data-v="phys">물리</button><button data-v="both">둘 다</button></div></div>
  <div class="grp"><label for="theme"><span>테마</span></label><select id="theme">
    <option value="paper">종이</option><option value="night">밤</option><option value="blue">청사진</option><option value="pastel">파스텔</option><option value="contrast">고대비</option></select></div>
  <span class="spacer"></span>
  <div class="grp"><label><input type="checkbox" id="live"> 실시간</label><button class="btn" id="apply" title="원본을 다시 읽어 그린다">적용</button></div>
  <button class="btn" id="fit" title="화면에 맞추기 (0)">맞추기</button>
  <button class="btn" id="relayout" title="보이는 엔터티를 다시 배치하고 위치 파일에 저장">자동 배치</button>
  <div class="grp"><span>내보내기</span><button class="btn" id="svg">SVG</button><button class="btn" id="png">PNG</button></div>
</header>
<aside>
  <div class="find">
    <input type="search" id="q" placeholder="엔터티·컬럼 찾기" aria-label="엔터티·컬럼 찾기">
    <div class="pick"><div class="seg" id="view" role="group" aria-label="보이는 엔터티">
      <button data-v="all">전체</button><button data-v="sel">선택만</button><button data-v="near">이웃까지</button></div>
      <button class="btn" id="clear" title="선택 해제 (Esc)">해제</button></div>
  </div>
  <div id="list" role="list"></div>
</aside>
<main>
  <svg id="c" xmlns="http://www.w3.org/2000/svg" aria-label="ERD"><g id="world"><g id="frames"></g><g id="rels"></g><g id="ents"></g></g></svg>
  <div id="tip" role="tooltip"></div>
  <div id="empty"><div><b id="empty-h"></b><span id="empty-t"></span></div></div>
  <div id="status" aria-live="polite"><span class="dot"></span><span id="status-t">읽는 중</span></div>
</main>
<script nonce="__NONCE__">
"use strict";
const CFG = __CONFIG__;
const NS = "http://www.w3.org/2000/svg";
const $ = (s) => document.querySelector(s);
const store = {get(k, d) { try { const v = localStorage.getItem("dataviewer." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem("dataviewer." + k, JSON.stringify(v)); } catch (e) {} }};
const S = {model: null, level: store.get("level", 3), names: store.get("names", "both"), theme: store.get("theme", "paper"),
           live: CFG.live, view: "all", sel: new Set(), pos: new Map(), size: new Map(), q: "",
           z: 1, px: 40, py: 40, pending: false, fitted: false, hover: null, placed: new Set(), off: new Map()};
const LAYOUT = {head1: 30, head2: 42, row: 18, pad: 6, minW: 150, gapX: 70, gapY: 36};
const measure = document.createElement("canvas").getContext("2d");
function textW(t, font) { measure.font = font; return measure.measureText(t || "").width; }
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs || {}) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function txt(parent, x, y, cls, s) { const t = el("text", {x, y, class: cls}, parent); t.textContent = s; return t; }
const gid = (src, key) => src.id + "|" + key;

/* ---------------------------------------------------------------- 자료 */
function tables() { const out = []; for (const s of S.model ? S.model.sources : []) for (const t of s.tables) out.push({s, t, id: gid(s, t.key)}); return out; }
function relations() { const out = []; for (const s of S.model ? S.model.sources : []) for (const r of s.relations) out.push({s, r, a: gid(s, r.from), b: gid(s, r.to)}); return out; }
function visibleIds() {
  const all = tables().map(x => x.id);
  if (S.view === "all" || !S.sel.size) return new Set(all);
  const v = new Set([...S.sel].filter(id => all.includes(id)));
  if (S.view === "near") for (const {a, b} of relations()) { if (S.sel.has(a)) v.add(b); if (S.sel.has(b)) v.add(a); }
  return v;
}
function rowsOf(t) {
  if (S.level <= 1) return [];
  if (S.level === 2) return t.columns.filter(c => c.pk || c.fk);
  return t.columns;
}
function label(t) { return S.names === "phys" || !t.kor ? [t.name, null] : S.names === "kor" ? [t.kor, null] : [t.kor, t.name]; }
function colLabel(c) { return S.names === "phys" || !c.kor ? c.name : S.names === "kor" ? c.kor : c.kor + " " + c.name; }
function keyMark(c) { return c.pk && c.fk ? "PF" : c.pk ? "PK" : c.fk ? "FK" : c.unique ? "UQ" : ""; }
function sizeOf(t) {
  const [a, b] = label(t);
  const head = b ? LAYOUT.head2 : LAYOUT.head1;
  let w = Math.max(textW(a, "700 13px " + getFont()) , b ? textW(b, "11px " + getFont()) : 0) + 34;
  const rows = rowsOf(t);
  for (const c of rows) {
    let cw = 34 + textW(colLabel(c), "600 12px " + getFont());
    if (S.level >= 4) cw += 18 + textW(c.type + (c.nullable ? "" : " NN"), "11px " + getMono());
    if (c.pi) cw += 18;
    w = Math.max(w, cw + 10);
  }
  const extra = S.level === 2 && t.columns.length > rows.length ? 1 : 0;
  return {w: Math.max(LAYOUT.minW, Math.ceil(w)), h: head + (rows.length + extra ? (rows.length + extra) * LAYOUT.row + LAYOUT.pad * 2 : 0), head};
}
let _font = null, _mono = null;
function getFont() { return _font || (_font = getComputedStyle(document.documentElement).getPropertyValue("--font")); }
function getMono() { return _mono || (_mono = getComputedStyle(document.documentElement).getPropertyValue("--mono")); }

/* ---------------------------------------------------------------- 자동 배치: 원본마다, 스키마마다, 부모를 왼쪽에 */
function autoPlace(only, force) {
  let accRight = -Infinity;
  for (const s of S.model.sources) {
    const ids = s.tables.map(t => gid(s, t.key));
    for (const t of s.tables) { const id = gid(s, t.key); if (!force && !S.pos.has(id) && t.pos) S.pos.set(id, {x: t.pos.x, y: t.pos.y}); }
    const todo = s.tables.filter(t => { const id = gid(s, t.key); return force ? (!only || only.has(id)) : !S.pos.has(id); });
    if (todo.length) {
      const keep = ids.filter(id => S.pos.has(id) && !todo.some(t => gid(s, t.key) === id));
      let x0 = Math.max(accRight > -Infinity ? accRight + 160 : 40, 40), y0 = 40;
      if (keep.length) { const b = bbox(keep); x0 = b.x2 + 120; y0 = b.y1; }
      const parents = new Map(s.tables.map(t => [t.key, []]));
      for (const r of s.relations) if (r.from !== r.to && parents.has(r.from)) parents.get(r.from).push(r.to);
      const rank = new Map();
      const depth = (k, seen) => { if (rank.has(k)) return rank.get(k); if (seen.has(k)) return 0; seen.add(k);
        const d = Math.max(-1, ...parents.get(k).filter(p => parents.has(p)).map(p => depth(p, seen))) + 1; rank.set(k, d); return d; };
      const bySchema = new Map();
      for (const t of todo) { if (!bySchema.has(t.schema)) bySchema.set(t.schema, []); bySchema.get(t.schema).push(t); }
      let gx = x0;
      for (const [, list] of [...bySchema].sort((a, b) => a[0].localeCompare(b[0]))) {
        const cols = new Map();
        for (const t of list) { const d = depth(t.key, new Set()); if (!cols.has(d)) cols.set(d, []); cols.get(d).push(t); }
        let x = gx, right = gx;
        for (const d of [...cols.keys()].sort((a, b) => a - b)) {
          const col = cols.get(d).sort((a, b) => a.name.localeCompare(b.name));
          let y = y0, w = 0;
          for (const t of col) { const sz = sizeOf(t); S.pos.set(gid(s, t.key), {x, y}); y += sz.h + LAYOUT.gapY; w = Math.max(w, sz.w); }
          x += w + LAYOUT.gapX; right = x;
        }
        gx = right + 90;
      }
    }
    if (ids.length) accRight = Math.max(accRight, bbox(ids).x2);
  }
  separate(force);
}
/* 원본끼리 겹치면 뒤 원본을 오른쪽으로 민다 -- 처음 그릴 때(또는 자동 배치 때)만. 사람이 옮겨 겹친 것은 그대로 둔다 */
function separate(all) {
  const done = [];
  for (const s of S.model.sources) {
    const ids = s.tables.map(t => gid(s, t.key)).filter(id => S.pos.has(id));
    if (!ids.length) continue;
    const b = bbox(ids);
    if ((all || !S.placed.has(s.id)) && done.length) {
      const hit = done.some(o => b.x1 < o.x2 + 120 && o.x1 < b.x2 + 120 && b.y1 < o.y2 + 80 && o.y1 < b.y2 + 80);
      if (hit) { const dx = Math.max(...done.map(o => o.x2)) + 160 - b.x1;
        for (const id of ids) { const p = S.pos.get(id); S.pos.set(id, {x: p.x + dx, y: p.y}); }
        S.off.set(s.id, (S.off.get(s.id) || 0) + dx); b.x1 += dx; b.x2 += dx; }
    }
    S.placed.add(s.id); done.push(b);
  }
}
function bbox(ids) {
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const id of ids) { const p = S.pos.get(id), z = S.size.get(id) || {w: LAYOUT.minW, h: 60}; if (!p) continue;
    x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y); x2 = Math.max(x2, p.x + z.w); y2 = Math.max(y2, p.y + z.h); }
  return {x1, y1, x2, y2};
}

/* ---------------------------------------------------------------- 그리기 */
function render() {
  if (!S.model) return;
  if (S.hover && S.hover.rel) S.hover = null;      // 다시 그리면 가리키던 선은 사라진다
  const all = tables();
  for (const {t, id} of all) S.size.set(id, sizeOf(t));
  autoPlace();
  const vis = visibleIds();
  const ents = $("#ents"), rels = $("#rels"), frames = $("#frames");
  ents.textContent = ""; rels.textContent = ""; frames.textContent = "";
  const q = S.q.trim().toLowerCase();
  // 스키마 틀 (원본 + 스키마마다)
  const groups = new Map();
  for (const {s, t, id} of all) if (vis.has(id)) { const g = s.id + "|" + t.schema; if (!groups.has(g)) groups.set(g, {s, schema: t.schema, ids: []}); groups.get(g).ids.push(id); }
  const multi = S.model.sources.length > 1;
  for (const g of groups.values()) {
    const b = bbox(g.ids), f = el("g", {class: "frame"}, frames);
    el("rect", {x: b.x1 - 22, y: b.y1 - 40, width: b.x2 - b.x1 + 44, height: b.y2 - b.y1 + 62, rx: 8}, f);
    const t = txt(f, b.x1 - 10, b.y1 - 20, "", g.schema);
    if (multi) { const sp = el("tspan", {class: "s", dx: 8}, t); sp.textContent = g.s.name; }
  }
  // 엔터티
  const rowY = new Map();

/* ---------------------------------------------------------------- 서버 */
function api(path, opts) { return fetch(CFG.base + path, Object.assign({cache: "no-store", headers: {"X-Viewer-Token": CFG.token, "Content-Type": "application/json"}}, opts || {})); }

    const todo = [...saveSet]; saveSet = new Set();
    for (const sid of todo) {
      const s = S.model.sources.find(x => x.id === sid); if (!s) continue;
      const positions = {}; for (const t of s.tables) { const p = S.pos.get(gid(s, t.key)); if (p) positions[t.key] = p; }
      try { const r = await api("/api/layout", {method: "POST", body: JSON.stringify({source: sid, positions})}); const j = await r.json();
        status(r.ok ? `위치를 ${j.file} 에 저장했다` : `위치를 저장하지 못했다: ${j.error || j.detail || r.status}`, r.ok ? "" : "bad"); }
      catch (e) { status("위치를 저장하지 못했다: 서버에 닿지 않는다", "bad"); }
    }

}

    const r = await api("/api/model"); if (!r.ok) throw new Error(r.status);
    const m = await r.json();

    // 원본에서 위치가 바뀐 엔터티(.dbm 을 pgModeler 에서 옮김 · 위치 파일 수정)는 새 위치를 따른다
    if (S.model) for (const s of m.sources) { const old = S.model.sources.find(x => x.id === s.id); if (!old) continue;
      const dx = s.layout_saved ? 0 : (S.off.get(s.id) || 0);
      for (const t of s.tables) { const o = old.tables.find(x => x.key === t.key); if (o && JSON.stringify(o.pos) !== JSON.stringify(t.pos) && t.pos) S.pos.set(gid(s, t.key), {x: t.pos.x + dx, y: t.pos.y}); } }

    renderList(); render(); syncButtons();

  $("#theme").value = S.theme; document.body.className = "t-" + S.theme;
  $("#live").checked = S.live; $("#live").disabled = !CFG.live;
  if (!CFG.live) $("#live").parentElement.title = "서버가 실시간 반영 없이 시작했다 (--no-watch) -- 적용 버튼으로 다시 읽는다";
  $("#apply").classList.toggle("due", S.pending);
  $("#apply").textContent = S.pending ? "적용 (바뀜)" : "적용";
}
$("#level").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; S.level = +b.dataset.v; store.set("level", S.level); syncButtons(); render(); });
$("#names").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; S.names = b.dataset.v; store.set("names", S.names); syncButtons(); renderList(); render(); });
$("#view").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b || b.disabled) return; S.view = b.dataset.v; syncButtons(); render(); fit(); });
$("#theme").addEventListener("change", (e) => { S.theme = e.target.value; store.set("theme", S.theme); syncButtons(); });
$("#live").addEventListener("change", (e) => { S.live = e.target.checked; if (S.live && S.pending) load(false); syncButtons(); status(S.live ? "실시간 반영" : "적용을 누를 때 반영", S.live ? "" : "off"); });
$("#apply").addEventListener("click", () => load(true));
$("#fit").addEventListener("click", () => fit());
$("#clear").addEventListener("click", () => { S.sel.clear(); S.view = "all"; syncSel(); });
let relayoutArm = 0;
$("#relayout").addEventListener("click", (e) => {
  const b = e.currentTarget;
  if (!relayoutArm) { relayoutArm = setTimeout(() => { relayoutArm = 0; b.textContent = "자동 배치"; }, 3000); b.textContent = "한 번 더 누르면 배치"; return; }
  clearTimeout(relayoutArm); relayoutArm = 0; b.textContent = "자동 배치";
  const vis = visibleIds(); autoPlace(vis, true); saveLayout(new Set([...vis].map(id => id.split("|")[0]))); fit();
});
$("#q").addEventListener("input", (e) => { S.q = e.target.value; filterList(); render(); });
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") { const hits = [...document.querySelectorAll("#list .item:not(.hide)")].map(b => b.dataset.id);
  if (hits.length) { hits.forEach(id => S.sel.add(id)); syncSel(); fit(hits); } } });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input,select")) return;
  if (e.key >= "1" && e.key <= "4") { S.level = +e.key; store.set("level", S.level); syncButtons(); render(); }
  else if (e.key === "0") fit();
  else if (e.key === "Escape") { S.sel.clear(); S.view = "all"; syncSel(); }
  else if (e.key === "+" || e.key === "=") { S.z = Math.min(3, S.z * 1.2); applyView(); }
  else if (e.key === "-") { S.z = Math.max(0.1, S.z / 1.2); applyView(); }
});
window.addEventListener("resize", () => applyView());

/* ---------------------------------------------------------------- 내보내기 */
const VARS = ["--bg","--ink","--mute","--plate","--plate-line","--head","--rel","--hl","--sel","--frame","--frame-line","--k-code","--k-base","--k-tx","--k-hist","--k-pi","--font","--mono"];
function exportSvg() {
  const src = $("#c"), ids = [...visibleIds()], b = bbox(ids), m = 50;
  const out = src.cloneNode(true);
  out.removeAttribute("class"); out.removeAttribute("id");
  const w = Math.ceil(b.x2 - b.x1 + m * 2), h = Math.ceil(b.y2 - b.y1 + m * 2 + 40);
  out.setAttribute("width", w); out.setAttribute("height", h); out.setAttribute("viewBox", `${b.x1 - m} ${b.y1 - m - 40} ${w} ${h}`);
  out.querySelector("#world").removeAttribute("transform");
  out.querySelectorAll(".hit").forEach(n => n.remove());
  out.querySelectorAll(".flow,.on,.match").forEach(n => n.classList.remove("flow", "on", "match"));
  const cs = getComputedStyle(document.body);
  let css = ":root{" + VARS.map(v => `${v}:${cs.getPropertyValue(v)}`).join(";") + "}";
  for (const sh of document.styleSheets) for (const rule of sh.cssRules) if (/^\.(frame|ent|rel|k-)/.test(rule.selectorText || "")) css += rule.cssText;
  const st = document.createElementNS(NS, "style"); st.textContent = css; out.insertBefore(st, out.firstChild);
  const bg = document.createElementNS(NS, "rect"); for (const [k, v] of Object.entries({x: b.x1 - m, y: b.y1 - m - 40, width: w, height: h, fill: cs.getPropertyValue("--bg").trim()})) bg.setAttribute(k, v);
  out.insertBefore(bg, st.nextSibling);
  return {text: '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(out), w, h};
}
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
const fname = (ext) => (($("#sub").textContent || "erd").replace(/[^\w가-힣.-]+/g, "_")) + "-erd." + ext;
$("#svg").addEventListener("click", () => { const s = exportSvg(); download(new Blob([s.text], {type: "image/svg+xml"}), fname("svg")); status("SVG 로 내보냈다"); });
$("#png").addEventListener("click", () => {
  const s = exportSvg(), img = new Image(), scale = 2;
  img.onload = () => { const c = document.createElement("canvas"); c.width = s.w * scale; c.height = s.h * scale; const x = c.getContext("2d"); x.scale(scale, scale); x.drawImage(img, 0, 0);
    URL.revokeObjectURL(img.src); c.toBlob(b => { download(b, fname("png")); status("PNG 로 내보냈다"); }); };
  img.onerror = () => status("PNG 로 바꾸지 못했다 -- SVG 로 내보낸다", "bad");
  img.src = URL.createObjectURL(new Blob([s.text], {type: "image/svg+xml"}));
});

syncButtons(); status(S.live ? "읽는 중" : "적용을 누를 때 반영", S.live ? "" : "off");
load(false).then(listen);
</script>
